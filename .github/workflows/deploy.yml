name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_PORT: ${{ secrets.CONTABO_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull, install and restart backend
        env:
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_PORT: ${{ secrets.CONTABO_PORT }}
          SSH_USER: ${{ secrets.CONTABO_USER }}
          PROJECT_PATH: ${{ secrets.CONTABO_PROJECT_PATH }}
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "cd '$PROJECT_PATH' && bash scripts/deploy.sh"
